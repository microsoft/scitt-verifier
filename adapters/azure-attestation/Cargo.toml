[package]
name = "scitt-adapter-azure-attestation"
description = "Pure SNP authenticity and policy HOST_DATA appraisal of Azure Attestation evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
scitt-receipt = { path = "../../crates/scitt-receipt", default-features = false }
tav-crypto = { workspace = true }
tav-caci = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["crypto_compliant"]
azure-attestation = ["dep:tav-caci"]
crypto_compliant = ["scitt-receipt/crypto_compliant", "tav-crypto/crypto_openssl", "tav-crypto/crypto_webcrypto", "tav-crypto/crypto_windows", "tav-caci?/crypto_openssl", "tav-caci?/crypto_webcrypto", "tav-caci?/crypto_windows"]
