name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      # Not --all-features: the crypto backends are mutually exclusive, so
      # enabling them together drags in OpenSSL and fails on a machine that has
      # deliberately been kept free of it.
      - run: cargo clippy --all-targets
      - run: cargo test --workspace

      # The adapter is off by default, so the two steps above never compile a
      # line of it. Without this, its code could stop building — or start
      # failing its tests — and every job here would stay green.
      - run: cargo clippy -p scitt-adapter-azure-confidential-ledger --features azure-confidential-ledger --all-targets
      - run: cargo test -p scitt-adapter-azure-confidential-ledger --features azure-confidential-ledger

      # Same reasoning one level up. `adapter-azure-confidential-ledger` is what wires the
      # adapter into the CLI — the evidence loader, the policy translation, and
      # the rule that an adapter may only narrow a verdict. None of it is
      # compiled by the default build, so without these steps the monotonicity
      # tests could stop being run without anything turning red.
      - run: cargo clippy -p scitt-verifier --features adapter-azure-confidential-ledger --all-targets
      - run: cargo test -p scitt-verifier --features adapter-azure-confidential-ledger

  boundary:
    name: Core boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # scitt-receipt is meant to be embeddable — in a browser via WASM, in
      # Ledger Explorer, in someone else's service. That is only true while it
      # stays free of I/O, clocks, and policy. These greps are cheap and they
      # fail loudly the first time someone reaches for `std::fs` "just here".
      - name: Reject I/O, clocks, and policy coupling in the core
        run: |
          set -euo pipefail

          # Both crates make the same promise — callers supply bytes, we decide
          # nothing about time, exit status, or the network — so both are held
          # to it here. A crate that claims purity and is never scanned drifts.
          roots="crates/scitt-receipt/src adapters/azure-confidential-ledger/src"
          io_pattern='std::fs|File::open|read_to_string'

          # `if grep` cannot tell "found nothing" from "looked at nothing": both
          # exit non-zero, and being inside an `if` condition exempts them from
          # `set -e`. Rename or move the crate and every check below reports
          # clean forever — in the one job whose entire purpose is to notice.
          # So establish there is something to scan before trusting silence.
          for core in $roots; do
            test -d "$core" || {
              echo "::error::$core does not exist; these checks would pass without scanning anything"
              exit 1
            }
            scanned=$(find "$core" -name '*.rs' -type f | wc -l)
            test "$scanned" -gt 0 || {
              echo "::error::no .rs files under $core; these checks would pass without scanning anything"
              exit 1
            }
            echo "scanning $scanned .rs file(s) under $core"
          done

          # And that the detector fires at all, mirroring
          # `the_detectors_actually_detect` in design_commitments.rs: a check
          # that cannot fail proves nothing.
          probe=$(mktemp -d)
          printf 'let f = std::fs::read("x");\n' > "$probe/probe.rs"
          grep -rq --include='*.rs' -E "$io_pattern" "$probe" || {
            echo "::error::the detector did not fire on known-bad input; these checks prove nothing"
            exit 1
          }
          rm -rf "$probe"

          violations=0
          check() {
            local dir="$1" pattern="$2" message="$3" out status
            # grep: 0 found, 1 clean, 2+ broken. Only 1 is good news, and
            # collapsing 2 into it is how a broken check looks like a passing one.
            out=$(grep -rn --include='*.rs' -E "$pattern" "$dir") && status=0 || status=$?
            case $status in
              0) printf '%s\n' "$out"; echo "::error::$message"; violations=1 ;;
              1) ;;
              *) echo "::error::grep exited $status while checking: $message"; violations=1 ;;
            esac
          }

          for core in $roots; do
            check "$core" "$io_pattern" \
                  "$core must not perform file I/O; callers supply bytes."
            # \b matters: an unanchored 'chrono' matches tav_cose::synchronous.
            check "$core" 'SystemTime|Instant::now|\bchrono\b' \
                  "$core must not read the clock; freshness is a policy question."
            check "$core" 'std::process::exit|ExitCode' \
                  "$core must not decide exit codes."
            check "$core" 'reqwest|hyper|ureq|TcpStream' \
                  "$core must not open network connections; verification is offline."
          done

          check crates/scitt-receipt/src 'scitt_policy|scitt_verifier' \
                'scitt-receipt must not depend on policy or the CLI.'
          # This one is the structural half of "an adapter reports checks, not a
          # verdict". If scitt-adapter-azure-confidential-ledger could see the CLI, it could construct a
          # Verdict, and an appraisal that gathered no evidence could return a
          # pass. Keeping the type out of scope is what makes that impossible
          # rather than merely discouraged.
          check adapters/azure-confidential-ledger/src 'scitt_verifier' \
                'scitt-adapter-azure-confidential-ledger must not depend on the CLI; it reports checks, not verdicts.'
          exit $violations

      - name: Reject dependency drift in the core manifests
        run: |
          set -euo pipefail
          check_manifest() {
            local manifest="$1" pattern="$2" message="$3"
            # Same trap as above: a grep that cannot open its target is not a
            # grep that found nothing.
            test -f "$manifest" || {
              echo "::error::$manifest does not exist; this check would pass without reading anything"
              exit 1
            }
            if grep -qE "$pattern" "$manifest"; then
              echo "::error::$message"
              exit 1
            fi
          }
          check_manifest crates/scitt-receipt/Cargo.toml \
            '^(scitt-policy|scitt-verifier)' \
            'scitt-receipt must not depend on scitt-policy or scitt-verifier.'
          # scitt-network is named here as well as scitt-verifier: it is where
          # networking lives, and a dependency edge to it would let the offline
          # appraisal reach the ledger it is supposed to be appraising from
          # evidence someone else collected.
          check_manifest adapters/azure-confidential-ledger/Cargo.toml \
            '^(scitt-verifier|scitt-network)' \
            'scitt-adapter-azure-confidential-ledger must not depend on scitt-verifier or scitt-network.'

  size:
    name: Binary size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      # The binary is downloaded on every pipeline run that uses the gate.
      # Size is a running cost, so regressions should be a conscious decision.
      - name: Enforce the size budget
        run: |
          set -euo pipefail
          budget=$((4 * 1024 * 1024))
          actual=$(stat -c%s target/release/scitt-verifier)
          printf 'scitt-verifier: %s bytes (budget %s)\n' "$actual" "$budget"
          if [ "$actual" -gt "$budget" ]; then
            echo "::error::binary exceeded the size budget"
            exit 1
          fi

      - run: cargo build --release -p scitt-verifier --features adapter-azure-confidential-ledger

      # The adapter build is what an operator gating on a ledger actually
      # downloads, so it gets a budget too rather than being left unmeasured.
      # Held to the same 4 MiB: an adapter is a reason to carry more code, not
      # a reason to stop counting it.
      - name: Enforce the size budget with the adapter
        run: |
          set -euo pipefail
          budget=$((4 * 1024 * 1024))
          actual=$(stat -c%s target/release/scitt-verifier)
          printf 'scitt-verifier + azure-confidential-ledger: %s bytes (budget %s)\n' "$actual" "$budget"
          if [ "$actual" -gt "$budget" ]; then
            echo "::error::adapter binary exceeded the size budget"
            exit 1
          fi

  wasm:
    name: WASM boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Pinned rather than floating: wasm-pack chooses the wasm-bindgen and
      # wasm-opt it runs, so an unpinned version can change the emitted bundle
      # without a single line of this repository changing.
      - name: Install wasm-pack
        run: |
          set -euo pipefail
          version=v0.13.1
          dir="wasm-pack-${version}-x86_64-unknown-linux-musl"
          curl -sSfL "https://github.com/rustwasm/wasm-pack/releases/download/${version}/${dir}.tar.gz" \
            | tar -xz -C /tmp
          sudo install "/tmp/${dir}/wasm-pack" /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Build the browser bundle
        working-directory: crates/scitt-wasm
        run: wasm-pack build --target nodejs --out-dir pkg-node --release

      # `cargo test` cannot see this. The pinned digests in the harness only
      # come out right if the Rust side, the wasm-bindgen shim, and the JSON
      # mapping all agree — and that agreement is what a browser consumer
      # actually depends on. A UI reading these field names is why it matters
      # that they cannot change silently.
      - name: Cross-implementation conformance through the JS boundary
        working-directory: crates/scitt-wasm
        run: node tests/corpus.node.mjs

      # Same reasoning as the binary budget, with a shorter fuse: this is
      # downloaded by a browser. The ceiling is loose on purpose — it is there
      # to catch accidentally linking something enormous, not to argue about
      # kilobytes.
      - name: Enforce the bundle size budget
        run: |
          set -euo pipefail
          budget=$((1024 * 1024))
          actual=$(stat -c%s crates/scitt-wasm/pkg-node/scitt_wasm_bg.wasm)
          printf 'scitt_wasm_bg.wasm: %s bytes (budget %s)\n' "$actual" "$budget"
          if [ "$actual" -gt "$budget" ]; then
            echo "::error::wasm bundle exceeded the size budget"
            exit 1
          fi

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Exercises the action's argument construction and exit-code mapping
      # against a locally built binary, so the wrapper is covered before a
      # release exists to download.
      - run: cargo build --release
      - name: Verify the corpus fixture through the CLI contract
        run: |
          # `-e` is explicit rather than inherited: GitHub's default shell is
          # `bash -e {0}`, so the assertions below already gate the step, but
          # relying on that makes correctness a property of the runner instead
          # of the script. The other jobs in this file set it explicitly too.
          # Under `-e` the verify call is itself the exit-code assertion, so the
          # `test $? -eq 0` line that used to follow it could only ever see 0.
          set -euo pipefail
          ./target/release/scitt-verifier verify \
            --statement corpus/fixtures/transparent-statement.cose \
            --scitt-keys corpus/fixtures/mst-test-scitt-keys.cbor \
            --policy corpus/policies/fixture-mst.json \
            --result /tmp/result.json \
            --format text
          jq -e '.appraisal.verdict == "statement-transparent"' /tmp/result.json
          jq -e '.appraisal.notChecked | length > 0' /tmp/result.json
          jq -e '.signedStatement.provenance.coveredBy == "statement-signer"' /tmp/result.json
          ./target/release/scitt-verifier verify \
            --statement corpus/fixtures/transparent-statement.cose \
            --scitt-keys corpus/fixtures/mst-test-scitt-keys.cbor \
            --policy corpus/policies/fixture-mst.json \
            --result /tmp/result.json \
            --format text
          jq -e '.appraisal.verdict == "statement-transparent"' /tmp/result.json
          jq -e '.appraisal.notChecked | length > 0' /tmp/result.json
          jq -e '.signedStatement.provenance.coveredBy == "statement-signer"' /tmp/result.json
