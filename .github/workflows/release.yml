name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl rather than gnu: the binary lands in whatever container a
          # pipeline happens to use, and a glibc version mismatch would turn a
          # deployment gate into a broken build for reasons unrelated to
          # transparency.
          #
          # `verify` marks the targets the runner can actually execute. A
          # cross-compiled binary cannot be smoke-tested on the host that built
          # it: aarch64-musl is a foreign architecture, and the macOS runners
          # are arm64 without Rosetta, so an x86_64-apple-darwin binary will
          # not run there either.
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  ext: '',     verify: true  }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, ext: '',     verify: false }
          - { os: macos-latest,   target: x86_64-apple-darwin,        ext: '',     verify: false }
          - { os: macos-latest,   target: aarch64-apple-darwin,       ext: '',     verify: true  }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     ext: '.exe', verify: true  }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation support
        if: endsWith(matrix.target, '-musl')
        run: |
          cargo install cross --locked
          echo "CARGO=cross" >> "$GITHUB_ENV"

      - name: Build
        run: ${CARGO:-cargo} build --release --target ${{ matrix.target }}
        shell: bash

      # The corpus is verified with the exact binary being shipped, not a
      # locally built one. A release that cannot verify the reference fixture
      # should never reach a user.
      - name: Verify the corpus with the release binary
        if: matrix.verify
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/scitt-verifier${{ matrix.ext }}"
          "$bin" verify \
            --statement corpus/fixtures/transparent-statement.cose \
            --scitt-keys corpus/fixtures/mst-test-scitt-keys.cbor \
            --policy corpus/policies/fixture-mst.json \
            --format text

      - name: Stage the asset
        shell: bash
        run: |
          set -euo pipefail
          name="scitt-verifier-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/scitt-verifier${{ matrix.ext }}" "$name"
          sha256sum "$name" > "$name.sha256" 2>/dev/null || shasum -a 256 "$name" > "$name.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            scitt-verifier-*
            !scitt-verifier-*/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: dist

      - name: Publish the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

  # TODO before v1.0: sign each asset with Artifact Signing, register the
  # statement with Microsoft Signing Transparency, and attach it here — so this
  # tool can be verified by the mechanism it implements.
  # See docs/distribution.md#bootstrapping-trust.
