name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl rather than gnu: the binary lands in whatever container a
          # pipeline happens to use, and a glibc version mismatch would turn a
          # deployment gate into a broken build for reasons unrelated to
          # transparency.
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  ext: '' }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, ext: '' }
          - { os: macos-latest,   target: x86_64-apple-darwin,        ext: '' }
          - { os: macos-latest,   target: aarch64-apple-darwin,       ext: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,     ext: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation support
        if: endsWith(matrix.target, '-musl')
        run: |
          cargo install cross --locked
          echo "CARGO=cross" >> "$GITHUB_ENV"

      - name: Build
        run: ${CARGO:-cargo} build --release --target ${{ matrix.target }}
        shell: bash

      # The corpus is verified with the exact binary being shipped, not a
      # locally built one. A release that cannot verify the reference fixture
      # should never reach a user.
      - name: Verify the corpus with the release binary
        if: "!endsWith(matrix.target, '-musl') || matrix.target == 'x86_64-unknown-linux-musl'"
        shell: bash
        run: |
          set -uo pipefail
          bin="target/${{ matrix.target }}/release/scitt-verifier${{ matrix.ext }}"
          "$bin" verify \
            --statement corpus/fixtures/transparent-statement.cose \
            --scitt-keys corpus/fixtures/musa-mst-july-scitt-keys.cbor \
            --policy corpus/policies/fixture-mst.json \
            --format text
          test $? -eq 0

      - name: Stage the asset
        shell: bash
        run: |
          set -euo pipefail
          name="scitt-verifier-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/scitt-verifier${{ matrix.ext }}" "$name"
          sha256sum "$name" > "$name.sha256" 2>/dev/null || shasum -a 256 "$name" > "$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            scitt-verifier-*
            !scitt-verifier-*/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # TODO before v1.0: sign each asset with Artifact Signing, register the
  # statement with Microsoft Signing Transparency, and attach it here — so this
  # tool can be verified by the mechanism it implements.
  # See docs/distribution.md#bootstrapping-trust.
