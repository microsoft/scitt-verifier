[package]
name = "scitt-verifier"
description = "Offline verifier for SCITT transparent statements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "scitt-verifier"
path = "src/main.rs"

[dependencies]
scitt-receipt = { path = "../scitt-receipt", default-features = false }
scitt-policy = { path = "../scitt-policy", default-features = false }
scitt-network = { path = "../scitt-network", default-features = false }
# Optional: the attestation appraiser. Optional because it pulls in the AMD and
# COSE verification stack, which is dead weight for the offline statement path
# that most runs take. Enabling it adds a binding mode; it changes nothing about
# how a statement is verified.
scitt-adapter-mst-ledger = { path = "../../adapters/mst-ledger", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["crypto_pure_rust"]
crypto_pure_rust = [
    "scitt-receipt/crypto_pure_rust",
    "scitt-policy/crypto_pure_rust",
    "scitt-adapter-mst-ledger?/crypto_pure_rust",
]
crypto_openssl = [
    "scitt-receipt/crypto_openssl",
    "scitt-policy/crypto_openssl",
    "scitt-adapter-mst-ledger?/crypto_openssl",
]
# The mst-ledger adapter: appraise saved or explicitly acquired ledger evidence
# against the execution policy an accepted statement embeds.
adapter-mst-ledger = ["dep:scitt-adapter-mst-ledger", "scitt-adapter-mst-ledger/mst-ledger"]
