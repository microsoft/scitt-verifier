[package]
name = "scitt-verifier"
description = "Offline verifier for SCITT transparent statements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "scitt-verifier"
path = "src/main.rs"

[dependencies]
scitt-receipt = { path = "../scitt-receipt", default-features = false }
scitt-policy = { path = "../scitt-policy", default-features = false }
scitt-network = { path = "../scitt-network", default-features = false }
# Optional: the attestation appraiser. Optional because it pulls in the AMD and
# COSE verification stack, which is dead weight for the offline statement path
# that most runs take. Enabling it adds a binding mode; it changes nothing about
# how a statement is verified.
#
# Renamed to `acl` for use inside this crate. The published name is spelled out
# because it is what a consumer types into a policy document and a CI line, and
# `acl` already means access-control list; the short key is a local convenience
# for the module that has no such ambiguity in scope.
acl = { package = "scitt-adapter-azure-confidential-ledger", path = "../../adapters/azure-confidential-ledger", default-features = false, optional = true }
# The image-reproduction adapter. Always built: it adds no dependency the CLI
# does not already carry, and it runs no build — it compares records.
repro = { package = "scitt-adapter-image-reproduction", path = "../../adapters/image-reproduction", default-features = false }
# Optional: binds a fresh AMD SEV-SNP report to the device a hardware BOM
# statement describes. Optional for the same reason as the ledger adapter: it
# carries the AMD verification stack.
snpdev = { package = "scitt-adapter-amd-snp-device", path = "../../adapters/amd-snp-device", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["crypto_pure_rust"]
crypto_pure_rust = [
    "scitt-receipt/crypto_pure_rust",
    "scitt-policy/crypto_pure_rust",
    "acl?/crypto_pure_rust",
    "snpdev?/crypto_pure_rust",
    "repro/crypto_pure_rust",
]
crypto_openssl = [
    "scitt-receipt/crypto_openssl",
    "scitt-policy/crypto_openssl",
    "acl?/crypto_openssl",
    "snpdev?/crypto_openssl",
    "repro/crypto_openssl",
]
# The Azure Confidential Ledger adapter: appraise saved or explicitly acquired
# ledger evidence against the execution policy an accepted statement embeds.
adapter-azure-confidential-ledger = ["dep:acl", "acl/azure-confidential-ledger"]
# The AMD SEV-SNP device adapter: appraise a supplied SNP report, its AMD
# certificates and the nonce it was requested with against the device an
# accepted hardware BOM statement names.
adapter-amd-snp-device = ["dep:snpdev"]
