[package]
name = "scitt-policy"
description = "Relying-party policy evaluation over verified SCITT statement facts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
scitt-receipt = { path = "../scitt-receipt", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["crypto_pure_rust"]
crypto_pure_rust = ["scitt-receipt/crypto_pure_rust"]
crypto_openssl = ["scitt-receipt/crypto_openssl"]
